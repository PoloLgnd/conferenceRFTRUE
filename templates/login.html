{% extends 'base.html' %}

{% block title %}Вход{% endblock %}

{% block content %}
<section class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow fade-in">
            <div class="card-body p-4">
                <h2 class="text-center mb-4"><i class="bi bi-box-arrow-in-right text-primary"></i> Вход</h2>
                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label for="login" class="form-label">Логин</label>
                        <input type="text" class="form-control" id="login" name="login" data-testid="login-login" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Пароль</label>
                        <input type="password" class="form-control" id="password" name="password" data-testid="login-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mt-3 hover-scale" data-testid="login-submit">Войти</button>
                </form>
                <div class="text-center mt-3">
                    <p class="mb-0">Еще не зарегистрированы? <a href="{{ url_for('register') }}">Регистрация</a></p>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
