{% extends 'base.html' %}

{% block title %}Регистрация{% endblock %}

{% block content %}
<section class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow fade-in">
            <div class="card-body p-4">
                <h2 class="text-center mb-4"><i class="bi bi-person-plus text-primary"></i> Регистрация</h2>
                <form method="POST" action="{{ url_for('register') }}">
                    <div class="mb-3">
                        <label for="login" class="form-label">Логин</label>
                        <input type="text" class="form-control" id="login" name="login" data-testid="reg-login" pattern="^[a-zA-Z0-9]{6,}$" title="Латиница и цифры, мин. 6 символов" required>
                        <div class="form-text">Только латинские буквы и цифры, минимум 6 символов</div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Пароль</label>
                        <input type="password" class="form-control" id="password" name="password" data-testid="reg-password" minlength="8" required>
                        <div class="form-text">Минимум 8 символов</div>
                    </div>
                    <div class="mb-3">
                        <label for="fio" class="form-label">ФИО</label>
                        <input type="text" class="form-control" id="fio" name="fio" data-testid="reg-fullname" pattern="^[а-яА-ЯёЁ\s]+$" title="Только кириллица и пробелы" required>
                        <div class="form-text">Только кириллица и пробелы</div>
                    </div>
                    <div class="mb-3">
                        <label for="phone" class="form-label">Телефон</label>
                        <input type="text" class="form-control" id="phone" name="phone" data-testid="reg-phone" pattern="^8\(\d{3}\)\d{3}-\d{2}-\d{2}$" placeholder="8(XXX)XXX-XX-XX" title="Формат: 8(XXX)XXX-XX-XX" required>
                        <div class="form-text">Формат: 8(XXX)XXX-XX-XX</div>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" data-testid="reg-email" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mt-3 hover-scale" data-testid="reg-submit">Создать пользователя</button>
                </form>
                <div class="text-center mt-3">
                    <p class="mb-0">Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a></p>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
